<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: deep indigo → rich violet, diagonal -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2D2A8E"/>
      <stop offset="42%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Top-center radial glow (premium soft light) -->
    <radialGradient id="topGlow" cx="256" cy="0" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Bottom-left subtle dark vignette (depth) -->
    <radialGradient id="vignette" cx="512" cy="512" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.30)"/>
    </radialGradient>

    <!-- Area fill under sparkline -->
    <linearGradient id="areaFill" x1="0" y1="170" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
    </linearGradient>

    <!-- Sparkline: right fades in, left full white -->
    <linearGradient id="lineColor" x1="118" y1="0" x2="394" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.42)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,1.00)"/>
    </linearGradient>

    <!-- End-dot glow halo -->
    <filter id="dotGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to icon bounds -->
    <clipPath id="iconBounds">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- ─── Radial light from top ─── -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#topGlow)"/>

  <!-- ─── Bottom-right vignette ─── -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#vignette)"/>

  <!-- ─── Outer glass ring (compass / premium frame) ─── -->
  <circle cx="256" cy="252" r="196"
          fill="rgba(255,255,255,0.055)"
          stroke="rgba(255,255,255,0.13)"
          stroke-width="1.5"/>

  <!-- ─── Area fill under sparkline (clipped to icon) ─── -->
  <path clip-path="url(#iconBounds)"
        d="M 118,328
           C 158,314  198,274  240,251
           C 282,228  330,201  394,178
           L 394,440 L 118,440 Z"
        fill="url(#areaFill)"/>

  <!-- ─── Sparkline: smooth ascending curve (growth ↑) ─── -->
  <path d="M 118,328
           C 158,314  198,274  240,251
           C 282,228  330,201  394,178"
        fill="none"
        stroke="url(#lineColor)"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- ─── Inflection dots ─── -->
  <circle cx="118" cy="328" r="7.5" fill="rgba(255,255,255,0.48)"/>
  <circle cx="240" cy="251" r="7.5" fill="rgba(255,255,255,0.62)"/>

  <!-- ─── End-point glow (the “now” moment — growth at the top-right) ─── -->
  <!-- Outer halo -->
  <circle cx="394" cy="178" r="28" fill="rgba(196,181,253,0.22)" filter="url(#dotGlow)"/>
  <!-- Mid ring -->
  <circle cx="394" cy="178" r="18" fill="rgba(255,255,255,0.30)"/>
  <!-- Core dot -->
  <circle cx="394" cy="178" r="12" fill="white"/>

  <!-- ─── Small horizontal "list" lines (finance / ledger accent, bottom-left) ─── -->
  <line x1="118" y1="382" x2="185" y2="382"
        stroke="rgba(255,255,255,0.38)" stroke-width="6" stroke-linecap="round"/>
  <line x1="118" y1="402" x2="160" y2="402"
        stroke="rgba(255,255,255,0.24)" stroke-width="6" stroke-linecap="round"/>

  <!-- ─── Glass top-edge bevel ─── -->
  <path d="M 115,54 Q 256,24 397,54"
        stroke="rgba(255,255,255,0.22)"
        stroke-width="2.5"
        fill="none"
        stroke-linecap="round"/>

  <!-- ─── Outer border micro-highlight ─── -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="114" ry="114"
        fill="none"
        stroke="rgba(255,255,255,0.09)"
        stroke-width="3"/>
</svg>
