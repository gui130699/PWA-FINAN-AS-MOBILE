<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2D2A8E"/>
      <stop offset="45%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="256" cy="0" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="coin1" cx="40%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="60%"  stop-color="#F5C518"/>
      <stop offset="100%" stop-color="#C8960C"/>
    </radialGradient>
    <radialGradient id="coin2" cx="40%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#FFE57A"/>
      <stop offset="60%"  stop-color="#F9CC24"/>
      <stop offset="100%" stop-color="#D4A00E"/>
    </radialGradient>
    <radialGradient id="coin3" cx="40%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#FFF0A0"/>
      <stop offset="60%"  stop-color="#FFD930"/>
      <stop offset="100%" stop-color="#DBA812"/>
    </radialGradient>
    <linearGradient id="edgeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D4900A"/>
      <stop offset="100%" stop-color="#A0700A"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="72" y1="340" x2="430" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
    <filter id="arrowShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="rgba(0,80,0,0.40)"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" ry="115" fill="url(#topGlow)"/>

  <g clip-path="url(#iconClip)">

    <!-- Coin stack 1 (left, 2 coins) cx=118 -->
    <ellipse cx="118" cy="408" rx="60" ry="13" fill="#9A6800"/>
    <rect x="58" y="378" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="118" cy="378" rx="60" ry="13" fill="#C89010"/>
    <rect x="58" y="348" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="118" cy="348" rx="60" ry="13" fill="url(#coin1)"/>
    <text x="118" y="356" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="20" font-weight="900" fill="#7A5000" opacity="0.90">$</text>

    <!-- Coin stack 2 (mid, 3 coins) cx=256 -->
    <ellipse cx="256" cy="408" rx="60" ry="13" fill="#9A6800"/>
    <rect x="196" y="378" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="256" cy="378" rx="60" ry="13" fill="#C89010"/>
    <rect x="196" y="348" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="256" cy="348" rx="60" ry="13" fill="#C89010"/>
    <rect x="196" y="318" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="256" cy="318" rx="60" ry="13" fill="url(#coin2)"/>
    <text x="256" y="326" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="20" font-weight="900" fill="#7A5000" opacity="0.90">$</text>

    <!-- Coin stack 3 (right, 4 coins) cx=394 -->
    <ellipse cx="394" cy="408" rx="60" ry="13" fill="#9A6800"/>
    <rect x="334" y="378" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="394" cy="378" rx="60" ry="13" fill="#C89010"/>
    <rect x="334" y="348" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="394" cy="348" rx="60" ry="13" fill="#C89010"/>
    <rect x="334" y="318" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="394" cy="318" rx="60" ry="13" fill="#C89010"/>
    <rect x="334" y="288" width="120" height="30" fill="#B07E0A"/>
    <ellipse cx="394" cy="288" rx="60" ry="13" fill="url(#coin3)"/>
    <text x="394" y="296" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="20" font-weight="900" fill="#7A5000" opacity="0.90">$</text>

    <!-- Upward trend arrow (green, zigzag) -->
    <g filter="url(#arrowShadow)">
      <polyline
        points="72,345 152,265 232,305 322,175 418,108"
        fill="none"
        stroke="url(#arrowGrad)"
        stroke-width="30"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Arrowhead -->
      <polygon points="418,108 368,128 390,162" fill="#4ade80"/>
    </g>

  </g>

  <rect x="2" y="2" width="508" height="508" rx="114" ry="114"
        fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="4"/>
</svg>
